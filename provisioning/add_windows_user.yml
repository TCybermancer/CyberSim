---
# Provision a puppet user on a Windows host, and (optionally) an AD user
# on the domain controller. Requires WinRM configured on targets, and the
# `ansible.windows` / `microsoft.ad` collections installed on the control
# node:
#   ansible-galaxy collection install ansible.windows microsoft.ad
#
# All WinRM traffic here rides the OOB NIC -- inventory.ini's
# windows_hosts and domain_controller groups should resolve to OOB IPs
# only. See docs/README.md.
#
# This playbook only creates the account(s) -- it doesn't install the
# cybersim agent itself. That's a separate step, and there are two ways
# to do it once this user exists:
#   1. Log in as target_user and use the dashboard's own install page
#      (http://<server>/ui/install.html, Windows tab) -- downloads
#      cybersim-agent-setup.exe, which autostarts via a Scheduled Task
#      at logon.
#   2. From the dashboard's Install agent -> Remote Install tab (or
#      POST /install/remote), which does the equivalent over WinRM
#      itself -- the same OOB connectivity this playbook already used
#      to reach the host, so no extra network path to open up.
# An earlier version of this playbook tried to install the agent
# directly (copying agent/ source, running it as a Windows service) --
# superseded once the real installer shipped (PyInstaller .exe + auto-
# filled config.yaml + Scheduled-Task-at-logon autostart, deliberately
# not a service, so a puppet host looks like a real logged-in user
# working -- see docs/README.md).
#
# Usage:
#   ansible-playbook -i inventory.ini add_windows_user.yml \
#     -e "target_user=jsmith target_persona=finance_analyst target_password=REDACTED"
# Pass target_password as an ansible-vault-encrypted value (e.g.
# `ansible-vault encrypt_string`) or via --ask-vault-pass with a vars
# file, not typed in cleartext on a real shared shell -- see
# group_vars/all/vault.yml.example's vault_<name> convention.

- name: Provision local puppet user on the Windows host
  hosts: windows_hosts
  vars:
    target_user: "changeme"
    target_persona: "generic"
    target_password: "changeme"

  tasks:
    - name: Ensure local puppet user exists
      ansible.windows.win_user:
        name: "{{ target_user }}"
        password: "{{ target_password }}"
        state: present
        groups:
          - Users
        description: "cybersim puppet ({{ target_persona }})"

- name: Optionally create the matching AD account on the domain controller
  hosts: domain_controller
  vars:
    target_user: "changeme"
    target_persona: "generic"
    target_password: "changeme"
    ad_ou: "OU=CyberSimPuppets,DC=corp,DC=local"

  tasks:
    - name: Ensure AD user exists
      microsoft.ad.user:
        name: "{{ target_user }}"
        firstname: "{{ target_user }}"
        password: "{{ target_password }}"
        path: "{{ ad_ou }}"
        enabled: true
        description: "cybersim puppet ({{ target_persona }})"
        state: present
