---
# Clones a lab domain controller from the template built by
# prepare_dc_template.yml, promotes it as the first DC of a brand-new
# forest, and finishes DNS so client machines on the in-band network are
# ready to join. Dual-homed per CyberSim's OOB/in-band split: an OOB NIC
# (DHCP) carries all the Ansible/WinRM traffic below; the in-band NIC is
# what the domain actually serves.
#
# Usage:
#   ansible-playbook -i inventory.ini build_domain_controller.yml --ask-vault-pass
#
# Everything below is prompted interactively; non-interactive/CI use can
# pass the same names via -e instead (e.g. -e domain_name=lab.local).

- name: Provision the DC's VM (clone, dual-NIC customization, wait for WinRM)
  hosts: localhost
  gather_facts: false
  vars_prompt:
    - name: domain_name
      prompt: "Fully-qualified DNS name for the new lab domain (e.g. lab.local)"
      private: false

    - name: dc_hostname
      prompt: "Hostname for the new DC (NetBIOS-safe, <=15 chars)"
      default: "DC01"
      private: false

    - name: inband_network_cidr
      prompt: "In-band services network CIDR the DC will serve"
      default: "10.20.20.0/24"
      private: false

    - name: dc_ip
      prompt: "Static IP for the DC on that network"
      default: "{{ (inband_network_cidr | ansible.utils.ipaddr('network')).split('.')[0:3] | join('.') }}.2"
      private: false

    - name: dc_gateway
      prompt: "Gateway for that network"
      default: "{{ (inband_network_cidr | ansible.utils.ipaddr('network')).split('.')[0:3] | join('.') }}.1"
      private: false

    - name: port_group
      prompt: "ESXi port group for the DC's in-band (client-facing) NIC"
      default: "Vlan20"
      private: false

    - name: oob_port_group_input
      prompt: "ESXi port group for the DC's OOB (management) NIC"
      default: "Tools"
      private: false

    - name: dns_forwarder_ip
      prompt: "DNS forwarder IP for queries outside this domain"
      default: "192.168.200.1"
      private: false

    - name: dsrm_password_input
      prompt: "Directory Services Restore Mode (DSRM) password for the new forest"
      private: true
      confirm: true

  vars:
    dc_vm_name: "{{ dc_hostname }}"
    inband_port_group: "{{ port_group }}"
    oob_port_group: "{{ oob_port_group_input }}"
    dsrm_password: "{{ dsrm_password_input }}"
    dc_netmask: "{{ inband_network_cidr | ansible.utils.ipaddr('netmask') }}"
    domain_netbios_name: "{{ (domain_name.split('.')[0] | upper)[:15] }}"
    dc_reverse_zone_name: "{{ (inband_network_cidr | ansible.utils.ipaddr('revdns')).split('.')[1:] | join('.') | regex_replace('\\.$', '') }}"

  roles:
    - dc_provision

- name: Promote the forest and finish DNS
  hosts: domain_controller
  gather_facts: false
  vars:
    domain_name: "{{ hostvars['localhost']['domain_name'] }}"
    domain_netbios_name: "{{ hostvars['localhost']['domain_netbios_name'] }}"
    dsrm_password: "{{ hostvars['localhost']['dsrm_password'] }}"
    dns_forwarder_ip: "{{ hostvars['localhost']['dns_forwarder_ip'] }}"
    dc_reverse_zone_name: "{{ hostvars['localhost']['dc_reverse_zone_name'] }}"
  roles:
    - dc_ad_forest
    - dc_dns_config

- name: Summarize
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Print connection details for client machines
      ansible.builtin.debug:
        msg:
          - "Domain: {{ domain_name }} ({{ domain_netbios_name }})"
          - "DC: {{ dc_hostname }} at {{ dc_ip }} on port group {{ port_group }}"
          - "Point client DNS at {{ dc_ip }} and they're ready to join."
