---
# Converts an existing, already-installed Windows Server VM (source_vm_name)
# into a reusable, generalized template that dc_provision can clone from.
#
# Runs entirely over VMware guest operations (scripts/vmware_guestexec.py),
# never over WinRM/network -- this VM may be sitting on whatever port group
# it was last used on, and we don't want to depend on network reachability
# to it during prep. WinRM only becomes relevant later, against clones.
#
# Prerequisite (one-time, manual, cannot be automated -- see role README):
# roles/dc_template_prep/files/bootstrap_console.ps1 must already have been
# run from an interactive console/RDP session as a local admin. Windows
# filters the admin token for any *headless* admin action from a
# non-built-in-Administrator local account -- by design -- so this can't be
# done via guest-ops before it's done once by hand.

- name: Ensure source VM is powered on
  community.vmware.vmware_guest_powerstate:
    hostname: "{{ esxi_hostname }}"
    username: "{{ esxi_username }}"
    password: "{{ esxi_password }}"
    validate_certs: "{{ esxi_validate_certs }}"
    name: "{{ source_vm_name }}"
    state: powered-on
  delegate_to: localhost

- name: Wait for VMware Tools to be running
  community.vmware.vmware_guest_tools_wait:
    hostname: "{{ esxi_hostname }}"
    username: "{{ esxi_username }}"
    password: "{{ esxi_password }}"
    validate_certs: "{{ esxi_validate_certs }}"
    name: "{{ source_vm_name }}"
  delegate_to: localhost

- name: Verify the one-time console bootstrap has already been run
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/scripts/vmware_guestexec.py"
      - --vm-name
      - "{{ source_vm_name }}"
      - --command
      - 'reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v LocalAccountTokenFilterPolicy'
  environment:
    ESXI_HOST: "{{ esxi_hostname }}"
    ESXI_USER: "{{ esxi_username }}"
    ESXI_PASSWORD: "{{ esxi_password }}"
    GUEST_USER: "{{ template_guest_user }}"
    GUEST_PASSWORD: "{{ template_guest_password }}"
  register: token_policy_check
  changed_when: false
  failed_when: false
  no_log: true
  delegate_to: localhost

- name: Fail with guidance if the console bootstrap step hasn't been run
  ansible.builtin.fail:
    msg: >-
      LocalAccountTokenFilterPolicy is not set to 1 on {{ source_vm_name }}.
      Log into its console (ESXi web UI) as {{ template_guest_user }},
      elevate, and run roles/dc_template_prep/files/bootstrap_console.ps1
      once -- this can't be automated headlessly by design (Windows UAC
      remote-admin restriction on non-builtin-Administrator accounts).
  when: "'0x1' not in token_policy_check.stdout"

- name: Check whether the guest is domain-joined
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/scripts/vmware_guestexec.py"
      - --vm-name
      - "{{ source_vm_name }}"
      - --command
      - powershell -NoProfile -Command "(Get-WmiObject Win32_ComputerSystem).PartOfDomain"
  environment:
    ESXI_HOST: "{{ esxi_hostname }}"
    ESXI_USER: "{{ esxi_username }}"
    ESXI_PASSWORD: "{{ esxi_password }}"
    GUEST_USER: "{{ template_guest_user }}"
    GUEST_PASSWORD: "{{ template_guest_password }}"
  register: domain_joined_check
  changed_when: false
  no_log: true
  delegate_to: localhost

- name: Unjoin from any existing domain (local admin creds, no DC contact required)
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/scripts/vmware_guestexec.py"
      - --vm-name
      - "{{ source_vm_name }}"
      - --command
      - powershell -NoProfile -Command "Remove-Computer -Force -PassThru -Restart"
      - --no-wait
  environment:
    ESXI_HOST: "{{ esxi_hostname }}"
    ESXI_USER: "{{ esxi_username }}"
    ESXI_PASSWORD: "{{ esxi_password }}"
    GUEST_USER: "{{ template_guest_user }}"
    GUEST_PASSWORD: "{{ template_guest_password }}"
  when: "'True' in domain_joined_check.stdout"
  no_log: true
  delegate_to: localhost

- name: Wait for reboot after domain unjoin
  ansible.builtin.pause:
    seconds: 90
  when: "'True' in domain_joined_check.stdout"

- name: Re-wait for VMware Tools after unjoin reboot
  community.vmware.vmware_guest_tools_wait:
    hostname: "{{ esxi_hostname }}"
    username: "{{ esxi_username }}"
    password: "{{ esxi_password }}"
    validate_certs: "{{ esxi_validate_certs }}"
    name: "{{ source_vm_name }}"
  delegate_to: localhost
  when: "'True' in domain_joined_check.stdout"

- name: Copy sysprep unattend file into the guest (guest-ops, no network needed)
  community.vmware.vmware_guest_file_operation:
    hostname: "{{ esxi_hostname }}"
    username: "{{ esxi_username }}"
    password: "{{ esxi_password }}"
    validate_certs: "{{ esxi_validate_certs }}"
    vm_id: "{{ source_vm_name }}"
    vm_username: "{{ template_guest_user }}"
    vm_password: "{{ template_guest_password }}"
    copy:
      src: "{{ role_path }}/files/sysprep_unattend.xml"
      dest: 'C:\Windows\System32\Sysprep\unattend.xml'
      overwrite: true
  no_log: true
  delegate_to: localhost

- name: Generalize with sysprep and shut down (fire-and-forget -- guest-tools connection drops mid-command)
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/scripts/vmware_guestexec.py"
      - --vm-name
      - "{{ source_vm_name }}"
      - --command
      - '"C:\Windows\System32\Sysprep\sysprep.exe" /generalize /oobe /shutdown /unattend:"C:\Windows\System32\Sysprep\unattend.xml"'
      - --no-wait
  environment:
    ESXI_HOST: "{{ esxi_hostname }}"
    ESXI_USER: "{{ esxi_username }}"
    ESXI_PASSWORD: "{{ esxi_password }}"
    GUEST_USER: "{{ template_guest_user }}"
    GUEST_PASSWORD: "{{ template_guest_password }}"
  no_log: true
  delegate_to: localhost

- name: Wait for the VM to power off (sysprep generalize can take several minutes)
  community.vmware.vmware_guest_info:
    hostname: "{{ esxi_hostname }}"
    username: "{{ esxi_username }}"
    password: "{{ esxi_password }}"
    validate_certs: "{{ esxi_validate_certs }}"
    name: "{{ source_vm_name }}"
  delegate_to: localhost
  register: vm_info
  until: vm_info.instance.hw_power_status == "poweredOff"
  retries: 60
  delay: 15

- name: Resolve the source VM's numeric vmid (needed for vim-cmd markastemplate)
  ansible.builtin.shell:
    cmd: >
      vim-cmd vmsvc/getallvms | awk -v n="{{ source_vm_name }}" '$2==n {print $1}'
  register: source_vmid
  changed_when: false
  delegate_to: "{{ esxi_ssh_host }}"

- name: Fail if the vmid could not be resolved
  ansible.builtin.fail:
    msg: "Could not resolve vmid for {{ source_vm_name }} via vim-cmd vmsvc/getallvms"
  when: source_vmid.stdout | trim == ""

- name: Convert the generalized VM into a template (vim-cmd, standalone ESXi has no REST 'mark as template' equivalent)
  ansible.builtin.command:
    cmd: "vim-cmd vmsvc/markastemplate {{ source_vmid.stdout | trim }}"
  delegate_to: "{{ esxi_ssh_host }}"

- name: Confirm it is now flagged as a template
  ansible.builtin.command:
    cmd: "vim-cmd vmsvc/get.summary {{ source_vmid.stdout | trim }}"
  register: template_summary
  changed_when: false
  delegate_to: "{{ esxi_ssh_host }}"

- name: Assert template flag is set
  ansible.builtin.assert:
    that: "'template = true' in template_summary.stdout"
    fail_msg: "{{ source_vm_name }} does not show template = true after markastemplate"
