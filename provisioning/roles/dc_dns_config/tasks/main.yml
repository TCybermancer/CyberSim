---
# Finishes DNS so client machines on the in-band network are actually
# ready to join: forwarder for everything outside this AD domain, a
# reverse lookup zone for the in-band subnet, scavenging so stale
# records from decommissioned range hosts don't linger, and a sanity
# check that dcpromo's AD-integrated forward zone is really there.

- name: Ensure the AD-integrated forward zone for the domain exists (sanity check, dcpromo creates this automatically)
  ansible.windows.win_shell: |
    if (-not (Get-DnsServerZone -Name '{{ domain_name }}' -ErrorAction SilentlyContinue)) {
      Write-Output 'MISSING'
    } else {
      Write-Output 'PRESENT'
    }
  register: forward_zone_check
  changed_when: false

- name: Fail if the forward zone is missing (dcpromo should have created it)
  ansible.builtin.fail:
    msg: "AD-integrated forward zone {{ domain_name }} is missing -- forest promotion may not have completed cleanly."
  when: "'MISSING' in forward_zone_check.stdout"

- name: Create the reverse lookup zone for the in-band subnet
  community.windows.win_dns_zone:
    name: "{{ dc_reverse_zone_name }}"
    type: primary
    replication: domain
    dynamic_update: secure
    state: present

- name: Set the DNS forwarder for anything outside this domain
  ansible.windows.win_shell: |
    Set-DnsServerForwarder -IPAddress {{ dns_forwarder_ip }} -PassThru
  register: forwarder_result
  changed_when: "'IPAddress' in forwarder_result.stdout"

- name: Enable DNS scavenging so stale range-host records get cleaned up
  ansible.windows.win_shell: |
    Set-DnsServerScavenging -ScavengingState $true -ScavengingInterval {{ dns_scavenging_interval | default('7.00:00:00') }} -ApplyOnAllZones -PassThru
  register: scavenging_result
  changed_when: true

- name: Ensure Windows Firewall's AD DS/DNS predefined rule groups are enabled
  ansible.windows.win_shell: |
    netsh advfirewall firewall set rule group="DNS Service" new enable=yes
    netsh advfirewall firewall set rule group="Active Directory Domain Services" new enable=yes
    netsh advfirewall firewall set rule group="Kerberos Key Distribution Center" new enable=yes
  changed_when: true

- name: Classify both NICs as Private (Public profile would block AD/DNS traffic from clients)
  ansible.windows.win_shell: |
    Get-NetConnectionProfile | Where-Object { $_.NetworkCategory -ne 'Private' } | Set-NetConnectionProfile -NetworkCategory Private
  changed_when: true
