# Shared website-category pools for web_browse steps (see
# scenario_engine.py's _resolve_target()). A schedule step can use
# `targets_category: <name>` instead of hand-writing a `targets:` list --
# resolve()/resolve_window() pick one entry from the named pool via the
# same seeded rng.choice() used for an explicit `targets:` list, so
# determinism/replay still holds.
#
# These are real, live public domains -- picking one generates genuine
# DNS/HTTP traffic to an actual site, same as any other web_browse
# target. Org-internal targets (a persona's own ticketing system,
# intranet, etc.) stay hand-written per scenario file's `targets:` list
# rather than living here -- each simulated org's internal hostnames are
# tenant-specific (see e.g. it_help_desk_technician*.yaml's per-org
# ticketing-system domains) and would be wrong to share across orgs.
#
# General-purpose (any persona, "off-task"/background browsing realism):
social_media:
  - https://www.facebook.com
  - https://twitter.com
  - https://www.instagram.com
  - https://www.linkedin.com
  - https://www.reddit.com
  - https://www.pinterest.com

ecommerce:
  - https://www.amazon.com
  - https://www.ebay.com
  - https://www.etsy.com
  - https://www.walmart.com
  - https://www.target.com
  - https://www.bestbuy.com

