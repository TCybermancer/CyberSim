# Vantage Corp / IT. should_alert: anomalous access to a domain-admin-
# credentials-adjacent share -- a privilege-escalation-attempt pattern,
# mirroring the airport counterpart intentionally.

persona: IT Help Desk Technician
org: Vantage Corp
department: IT
after_hours_eligible: true

schedule:
  - action: web_browse
    repeat: 8-15
    delay_before: 1-5m
    targets:
      - http://ticketing-system.vantage.local
      - http://remote-support-portal.vantage.local
    duration: 5-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: web_browse
    repeat: 10-20
    delay_before: 5-10m
    targets_category: it_reference
    duration: 5-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: web_browse
    repeat: 5-10
    delay_before: 15-30m
    targets_category: news
    duration: 5-10m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: email_send
    repeat: 8-15
    delay_before: 5-10m
    params:
      to: employee-puppet@vantage.local
      template: generic
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: email_send
    delay_before: 5-10m
    params:
      to: employee-puppet@vantage.local
      template: generic
      content_brief: >
        Write as an IT Help Desk Technician, replying to a user's password reset request with next steps (reset link sent via the self-service portal, call the help desk if it expires) -- do not include any actual password or reset code, just describe the process. Friendly, brief, support-desk tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: help_desk_ticket_backlog.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\vantage-fileserver01\\it"
      ops: [browse, copy_file]
      file: software_deployment_package_v4.zip
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\vantage-fileserver01\\it"
      ops: [browse, copy_file]
      file: domain_admin_credential_vault_export.csv
    duration: 1-2m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
