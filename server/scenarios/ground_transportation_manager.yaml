# Airport org / Airport Operations department. should_alert: bulk copy
# of parking/payment revenue data off the ground-transportation share
# (data staging, financial data this time for variety).

persona: ground_transportation_manager
org: Metro Airport
department: Airport Operations

schedule:
  - action: web_browse
    repeat: 8-15
    delay_before: 1-5m
    targets:
      - http://parking-management.corp.local
      - http://rideshare-coordination.corp.local
    duration: 5-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: web_browse
    repeat: 10-20
    delay_before: 5-10m
    targets_category: aviation_ops_reference
    duration: 5-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: web_browse
    repeat: 5-10
    delay_before: 15-30m
    targets_category: news
    duration: 5-10m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: email_send
    repeat: 8-15
    delay_before: 5-10m
    params:
      to: transportation-authority-puppet@corp.local
      template: generic
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: email_send
    delay_before: 5-10m
    params:
      to: transportation-authority-puppet@corp.local
      template: generic
      content_brief: >
        Write as the Ground Transportation Manager, raising concerns with the local
        transportation authority about rideshare vehicles congesting the departures
        curb during peak hours, and proposing a dedicated staging area be added to
        the curbside management plan. Professional, solution-oriented tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: parking_revenue_utilization_report.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\fileserver01\\ground-transportation"
      ops: [browse, copy_file]
      file: shuttle_schedule_current.pdf
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\fileserver01\\ground-transportation"
      ops: [browse, copy_file]
      file: parking_payment_transactions_all_2026.zip
    duration: 3-6m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
