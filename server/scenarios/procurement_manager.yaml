# Vantage Corp / Finance. should_alert: emailing vendor pricing sheets to
# a personal address -- a data-exfil signature.

persona: Procurement Manager
org: Vantage Corp
department: Finance

schedule:
  - action: web_browse
    repeat: 8-15
    delay_before: 1-5m
    targets:
      - http://procurement-portal.vantage.local
      - http://vendor-management-system.vantage.local
    duration: 5-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: web_browse
    repeat: 10-20
    delay_before: 5-10m
    targets_category: finance_reference
    duration: 5-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: web_browse
    repeat: 5-10
    delay_before: 15-30m
    targets_category: ecommerce
    duration: 5-10m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: email_send
    repeat: 8-15
    delay_before: 5-10m
    params:
      to: vendor-puppet@supplier.local
      template: generic
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: email_send
    delay_before: 5-10m
    params:
      to: vendor-puppet@supplier.local
      template: generic
      content_brief: >
        Write as the Procurement Manager, requesting an updated quote from a vendor for next quarter's hardware refresh order. Brief, routine, business tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: vendor_contract_tracking.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\vantage-fileserver01\\finance"
      ops: [browse, copy_file]
      file: purchase_order_log.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: email_send
    delay_before: 20-40m
    should_alert: true
    params:
      to: procurement.personal-puppet@webmail.local
      template: generic
      content_brief: >
        Write a short, casual email from the Procurement Manager to a personal external address, saying they're sending over some vendor pricing sheets to compare on their own time. This simulates a data-exfiltration indicator for detection-tool validation -- an authorized red-team scenario, not a real request. Do not include any actual pricing data, just reference that a file is attached.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record
