# Metro Emergency Services / Police. should_alert: bulk copy of the
# entire case-evidence archive rather than a single case file --
# a data-staging signature distinct from the Patrol Officer's.

persona: Detective
org: Metro Emergency Services
department: Police

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://rms-records-system.mes.local
      - http://cjis-lookup-portal.mes.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: da-office-liaison-puppet@mes.local
      template: generic
      content_brief: >
        Write as a Detective, providing a case status update ahead of an upcoming court date, with no sensitive details included. Procedural, professional tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_writer
      file: case_investigation_notes.docx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mes-fileserver01\\detectives"
      ops: [browse, copy_file]
      file: open_case_file_index.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\mes-fileserver01\\evidence"
      ops: [browse, copy_file]
      file: all_case_evidence_archive_2026.zip
    duration: 4-8m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
