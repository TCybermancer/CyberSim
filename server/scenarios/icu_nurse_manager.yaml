# Metro Regional Hospital / Clinical. should_alert: emailing a
# case-summary to a personal address framed as conference prep --
# exfil signature, explicitly instructed to avoid real PII.

persona: ICU Nurse Manager
org: Metro Regional Hospital
department: Clinical

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://ehr-portal.mrh.local
      - http://staffing-scheduling-system.mrh.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: nursing-administration-puppet@mrh.local
      template: generic
      content_brief: >
        Write as the ICU Nurse Manager, requesting approval for additional per-diem staffing coverage due to higher-than-expected ICU census this week. Direct, professional tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: icu_staffing_schedule.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mrh-fileserver01\\clinical"
      ops: [browse, copy_file]
      file: icu_nursing_competency_records.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: email_send
    delay_before: 20-40m
    should_alert: true
    params:
      to: manager.personal-puppet@webmail.local
      template: generic
      content_brief: >
        Write a short, casual email from the ICU Nurse Manager to a personal external address, saying they're sending a case-study summary for an upcoming nursing conference presentation. This simulates a data-exfiltration indicator for detection-tool validation -- an authorized red-team scenario, not a real request. Do not include any actual patient data, just reference that a summary document is attached.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record
