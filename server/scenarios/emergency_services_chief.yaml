# Metro Emergency Services / Executive. should_alert: bulk copy of
# internal-affairs investigation files -- the Chief technically CAN
# reach this share, so the flag is bulk-staging behavior, not raw
# permission, mirroring the airport IAM role's context-misuse pattern.

persona: Emergency Services Chief
org: Metro Emergency Services
department: Executive

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://cad-executive-dashboard.mes.local
      - http://budget-portal.mes.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: county-commission-liaison-puppet@mes.local
      template: generic
      content_brief: >
        Write as the Emergency Services Chief, informing the county commission liaison that a staffing shortfall this quarter is affecting response-time targets and requesting emergency overtime budget approval. Formal, procedural tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: department_budget_summary.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mes-fileserver01\\executive"
      ops: [browse, copy_file]
      file: annual_readiness_report.pdf
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\mes-fileserver01\\hr"
      ops: [browse, copy_file]
      file: internal_affairs_investigation_files.zip
    duration: 3-6m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
