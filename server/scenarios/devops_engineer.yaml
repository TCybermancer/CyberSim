# Vantage Corp / Engineering. should_alert: bulk export of production
# database credentials -- a credential-exfil signature distinct from
# the Software Engineer's source-code-focused pattern.

persona: DevOps Engineer
org: Vantage Corp
department: Engineering

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://ci-cd-pipeline-dashboard.vantage.local
      - http://infrastructure-as-code-repository.vantage.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: engineering-team-puppet@vantage.local
      template: generic
      content_brief: >
        Write as a DevOps Engineer, notifying the team of a planned production deployment window tonight and the rollback plan if issues arise. Technical, brief tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_writer
      file: deployment_runbook.docx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\vantage-fileserver01\\engineering"
      ops: [browse, copy_file]
      file: ci_cd_pipeline_configuration.docx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\vantage-fileserver01\\it"
      ops: [browse, copy_file]
      file: production_database_credentials_backup.csv
    duration: 2-4m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
