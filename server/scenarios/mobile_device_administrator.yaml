# Metro Emergency Services / IT. should_alert: bulk-copying the
# body-camera footage index -- a data-staging signature distinct from
# the other IT roles' credential-focused patterns.

persona: Mobile Device Administrator
org: Metro Emergency Services
department: IT

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://mdm-console.mes.local
      - http://mobile-app-deployment-portal.mes.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: patrol-supervisors-puppet@mes.local
      template: generic
      content_brief: >
        Write as the Mobile Device Administrator, notifying patrol supervisors that a security patch for in-car computers and body-worn cameras will be pushed overnight, and to report any device issues afterward. Technical, brief tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: device_inventory_and_compliance_report.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mes-fileserver01\\it"
      ops: [browse, copy_file]
      file: mdm_enrollment_procedures.pdf
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\mes-fileserver01\\executive"
      ops: [browse, copy_file]
      file: body_camera_footage_index_q3.zip
    duration: 3-6m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
