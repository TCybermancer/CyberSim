# Meridian Logistics / Fleet. should_alert: bulk access to driver
# license and background-check records -- a PII bulk-exfil signature.

persona: Fleet Dispatcher
org: Meridian Logistics
department: Fleet

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://tms-portal.meridianlog.local
      - http://gps-tracking-dashboard.meridianlog.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: drivers-puppet@meridianlog.local
      template: generic
      content_brief: >
        Write as the Fleet Dispatcher, notifying drivers of a route change for tomorrow due to road construction, with the updated route reference. Brief, routine tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: daily_dispatch_log.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\meridian-fileserver01\\fleet"
      ops: [browse, copy_file]
      file: route_assignment_schedule.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\meridian-fileserver01\\hr"
      ops: [browse, copy_file]
      file: driver_license_and_background_check_records.zip
    duration: 2-4m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
