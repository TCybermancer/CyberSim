# Airport org / IT department. should_alert: anomalous access to a
# domain-admin-credentials-adjacent share (privilege-escalation-attempt
# pattern -- help desk has no normal reason to be there).

persona: it_help_desk_technician
org: Metro Airport
department: IT

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://ticketing-system.corp.local
      - http://remote-support-portal.corp.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: badge-office-puppet@corp.local
      template: generic
      content_brief: >
        Write as an IT Help Desk Technician, replying to a user's password reset
        request with next steps (reset link sent via the self-service portal, and
        to call the help desk if the link expires) -- do not include any actual
        password or reset code, just describe the process. Friendly, brief,
        support-desk tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: help_desk_ticket_backlog.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-15m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\fileserver01\\it"
      ops: [browse, copy_file]
      file: software_deployment_package_v4.zip
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\fileserver01\\it-admin"
      ops: [browse, copy_file]
      file: domain_admin_credential_vault_export.csv
    duration: 1-2m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
