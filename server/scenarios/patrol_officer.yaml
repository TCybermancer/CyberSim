# Metro Emergency Services / Police. should_alert: anomalous access to
# the evidence share -- a patrol officer has no routine reason to be
# in the evidence log outside their own case.

persona: Patrol Officer
org: Metro Emergency Services
department: Police

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://rms-records-system.mes.local
      - http://in-car-computer-portal.mes.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: patrol-sergeant-puppet@mes.local
      template: generic
      content_brief: >
        Write as a Patrol Officer, submitting an end-of-shift activity summary noting a minor equipment issue with the in-car camera mount. Routine, brief tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_writer
      file: shift_activity_report.docx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mes-fileserver01\\patrol"
      ops: [browse, copy_file]
      file: patrol_zone_assignments.pdf
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\mes-fileserver01\\evidence"
      ops: [browse, copy_file]
      file: active_case_evidence_log.xlsx
    duration: 1-2m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
