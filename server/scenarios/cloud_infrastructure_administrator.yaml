# Vantage Corp / IT. should_alert: bulk export of the cloud API-key
# vault -- a credential-exfil signature, a new variant for this batch.

persona: Cloud Infrastructure Administrator
org: Vantage Corp
department: IT
after_hours_eligible: true

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://azure-portal.vantage.local
      - http://cloud-cost-management-portal.vantage.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: it-leadership-puppet@vantage.local
      template: generic
      content_brief: >
        Write as the Cloud Infrastructure Administrator, reporting that a cloud cost anomaly was detected in one subscription this week and recommending a resource audit. Technical, direct tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: cloud_resource_inventory_report.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\vantage-fileserver01\\it"
      ops: [browse, copy_file]
      file: cloud_architecture_diagrams.pdf
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\vantage-fileserver01\\it"
      ops: [browse, copy_file]
      file: cloud_api_key_vault_export.csv
    duration: 2-4m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
