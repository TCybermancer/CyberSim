# Airport org / Security department. should_alert: anomalous access to
# the Finance share -- a SOC analyst account has no normal reason to be
# there, which is exactly the point: a compromised SOC account is a
# high-value target since it can blind the very detection it should be
# monitoring. Lateral movement via that account, not a SOC-initiated
# action, is the realistic story here.

persona: soc_analyst
org: Metro Airport
department: Security

schedule:
  # Ambient, high-frequency steps: repeat fires this step that many times
  # across the day (resolve_window()/Ranges only -- see
  # scenario_engine._expand_repeats()), each instance independently
  # spread across the window and re-rolling its own random pick for a
  # targets_category step. See "repeat" in DEVELOPER_NOTES.md. The
  # should_alert step below deliberately has no repeat: a repeated "true
  # positive" would drown its own signal.
  - action: web_browse
    repeat: 15-25
    delay_before: 1-5m
    targets:
      - http://siem-dashboard.corp.local
      - http://threat-intel-portal.corp.local
    duration: 5-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: web_browse
    repeat: 10-20
    delay_before: 5-10m
    targets_category: it_reference
    duration: 5-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: web_browse
    repeat: 5-10
    delay_before: 15-30m
    targets_category: news
    duration: 5-10m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: email_send
    repeat: 8-15
    delay_before: 5-10m
    params:
      to: it-leadership-puppet@corp.local
      template: generic
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: email_send
    delay_before: 5-10m
    params:
      to: it-leadership-puppet@corp.local
      template: generic
      content_brief: >
        Write as a SOC Analyst, giving IT leadership a heads-up about a spike in
        phishing emails referencing airport payroll being reported by staff this
        week, and recommending a reminder be sent to all employees about verifying
        sender addresses before clicking links. Informative, no-alarm tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_writer
      file: soc_shift_handoff_report.docx
      ops: [open, edit_cells, save, close]
    duration: 10-15m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\fileserver01\\soc"
      ops: [browse, copy_file]
      file: incident_response_playbook.docx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\fileserver01\\finance"
      ops: [browse, copy_file]
      file: vendor_invoices_q3.xlsx
    duration: 1-2m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
