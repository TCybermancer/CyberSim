# Vantage Corp / Engineering. should_alert: bulk copy of the product
# source-code archive -- an IP/source-code exfil, data-staging
# signature.

persona: Software Engineer
org: Vantage Corp
department: Engineering

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://git-repository-portal.vantage.local
      - http://ci-cd-pipeline-dashboard.vantage.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: web_browse
    delay_before: 5-10m
    targets_category: it_reference
    duration: 5-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: web_browse
    delay_before: 30-60m
    targets_category: social_media
    duration: 5-10m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: email_send
    delay_before: 5-10m
    params:
      to: engineering-team-puppet@vantage.local
      template: generic
      content_brief: >
        Write as a Software Engineer, notifying the team of a merged pull request that changes an internal API contract, with a heads-up on what to update downstream. Technical, brief tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_writer
      file: sprint_planning_notes.docx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\vantage-fileserver01\\engineering"
      ops: [browse, copy_file]
      file: architecture_design_doc.docx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\vantage-fileserver01\\engineering"
      ops: [browse, copy_file]
      file: product_source_code_archive.zip
    duration: 4-8m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
