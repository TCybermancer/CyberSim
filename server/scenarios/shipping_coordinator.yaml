# Meridian Logistics / Warehouse. should_alert: anomalous access to the
# customer shipping address database -- a PII bulk-exfil signature.

persona: Shipping Coordinator
org: Meridian Logistics
department: Warehouse

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://wms-portal.meridianlog.local
      - http://carrier-rate-portal.meridianlog.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: customer-service-puppet@meridianlog.local
      template: generic
      content_brief: >
        Write as the Shipping Coordinator, notifying customer service of a carrier delay affecting a batch of outbound shipments this week, with revised delivery estimates. Informational, no-alarm tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: outbound_shipment_manifest_log.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\meridian-fileserver01\\warehouse"
      ops: [browse, copy_file]
      file: shipping_procedures_reference.docx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\meridian-fileserver01\\customer-service"
      ops: [browse, copy_file]
      file: customer_shipping_address_database.csv
    duration: 2-4m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
