# Metro Regional Hospital / Biomedical Engineering. should_alert: bulk
# access to networked-device config backups on the IT share -- an
# out-of-scope data-staging signature, plausible since biomed
# increasingly deals with networked equipment.

persona: Biomedical Engineering Technician
org: Metro Regional Hospital
department: Biomedical Engineering

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://cmms-equipment-management-system.mrh.local
      - http://device-recall-notification-portal.mrh.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: clinical-engineering-puppet@mrh.local
      template: generic
      content_brief: >
        Write as a Biomedical Engineering Technician, reporting that a batch of infusion pumps is due for preventive maintenance and requesting they be scheduled for pickup from clinical units. Brief, routine tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: equipment_maintenance_log.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mrh-fileserver01\\biomed"
      ops: [browse, copy_file]
      file: device_inventory_and_service_history.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\mrh-fileserver01\\it"
      ops: [browse, copy_file]
      file: network_device_config_backups.zip
    duration: 2-4m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
