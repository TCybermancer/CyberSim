# Metro Regional Hospital / Administration. should_alert: bulk export of
# patient appointment history -- a PII bulk exfil signature.

persona: Patient Scheduling Coordinator
org: Metro Regional Hospital
department: Administration

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://patient-scheduling-system.mrh.local
      - http://provider-availability-portal.mrh.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: clinic-staff-puppet@mrh.local
      template: generic
      content_brief: >
        Write as the Patient Scheduling Coordinator, confirming a schedule change for a provider's clinic hours next week and asking staff to update patient reminders accordingly. Brief, routine tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: appointment_scheduling_report.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mrh-fileserver01\\administration"
      ops: [browse, copy_file]
      file: scheduling_procedures_manual.docx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\mrh-fileserver01\\clinical"
      ops: [browse, copy_file]
      file: patient_appointment_history_bulk_export.csv
    duration: 2-4m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
