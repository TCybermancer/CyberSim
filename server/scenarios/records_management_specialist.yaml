# Metro Emergency Services / IT. should_alert: bulk access to sealed
# juvenile case records -- a highly sensitive PII-adjacent anomalous
# access pattern.

persona: Records Management Specialist
org: Metro Emergency Services
department: IT

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://rms-records-system.mes.local
      - http://public-records-request-portal.mes.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: legal-counsel-puppet@mes.local
      template: generic
      content_brief: >
        Write as the Records Management Specialist, flagging a public records request that appears to seek information exempt under an ongoing-investigation exclusion, asking for legal review before release. Procedural, careful tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: records_retention_schedule.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mes-fileserver01\\records"
      ops: [browse, copy_file]
      file: redaction_review_queue.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\mes-fileserver01\\evidence"
      ops: [browse, copy_file]
      file: sealed_juvenile_case_records.zip
    duration: 2-4m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
