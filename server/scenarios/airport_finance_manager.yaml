# Airport org / Executive department. The should_alert step here is a
# data-staging pattern -- an unusually large/bulk copy off the finance
# share -- distinct from the other Executive roles' red-team patterns.

persona: airport_finance_manager
org: Metro Airport
department: Executive

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://erp.corp.local
      - http://intranet.corp.local
    duration: 10-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-15m
    params:
      to: airline-liaison-puppet@corp.local
      template: generic
      content_brief: >
        Write as the Airport Finance Manager, informing an airline's finance liaison
        that next quarter's landing fee schedule has been revised upward due to
        rising maintenance costs, with the updated rate sheet to follow under
        separate cover. Professional, matter-of-fact tone, brief.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-20m
    params:
      app: libreoffice_calc
      file: q3_budget_reconciliation.xlsx
      ops: [open, edit_cells, save, close]
    duration: 15-25m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\fileserver01\\finance"
      ops: [browse, copy_file]
      file: vendor_invoices_q3.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\fileserver01\\finance"
      ops: [browse, copy_file]
      file: vendor_contracts_all_2026.zip
    duration: 3-6m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
