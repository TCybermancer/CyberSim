# Vantage Corp / Finance. should_alert: anomalous access to board
# compensation-committee notes -- context misuse.

persona: Accounting Manager
org: Vantage Corp
department: Finance

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://erp-financials-portal.vantage.local
      - http://expense-reporting-system.vantage.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: vantage-cfo-puppet@vantage.local
      template: generic
      content_brief: >
        Write as the Accounting Manager, reporting that month-end close is on track but flagging a reconciliation discrepancy in one cost center that needs review. Direct, professional tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: monthly_close_checklist.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\vantage-fileserver01\\finance"
      ops: [browse, copy_file]
      file: general_ledger_reconciliation.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\vantage-fileserver01\\executive"
      ops: [browse, copy_file]
      file: board_compensation_committee_notes.pdf
    duration: 1-2m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
