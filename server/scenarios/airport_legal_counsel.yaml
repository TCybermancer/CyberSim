# Airport org / Executive department. The should_alert step here is a
# suspicious-external-site browse (a typosquat/credential-phishing-style
# domain) -- a fourth distinct red-team pattern alongside the other
# Executive roles' anomalous-internal-access, data-staging, and
# PII-exfil signatures.

persona: airport_legal_counsel
org: Metro Airport
department: Executive

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://legal-research.corp.local
      - http://faa-compliance.corp.local
      - http://intranet.corp.local
    duration: 10-20m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-15m
    params:
      to: vendor-counsel-puppet@corp.local
      template: generic
      content_brief: >
        Write as Airport Legal Counsel, responding to outside vendor counsel about
        an indemnification clause in a ground-services contract under negotiation,
        pushing back on the proposed liability cap and requesting a redline by end
        of week. Formal, precise legal tone, brief.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-20m
    params:
      app: libreoffice_writer
      file: ground_services_contract_draft.docx
      ops: [open, edit_cells, save, close]
    duration: 15-30m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\fileserver01\\legal"
      ops: [browse, copy_file]
      file: vendor_contracts_index.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: web_browse
    delay_before: 20-40m
    should_alert: true
    targets:
      - http://secure-docshare-verify.example
    duration: 2-5m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session
