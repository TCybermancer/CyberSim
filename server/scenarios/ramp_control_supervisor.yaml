# Airport org / Airport Operations department. should_alert: anomalous
# after-hours access to the HR/security share (a ramp role has no normal
# reason to be in there).

persona: ramp_control_supervisor
org: Metro Airport
department: Airport Operations

schedule:
  - action: web_browse
    repeat: 8-15
    delay_before: 1-5m
    targets:
      - http://ground-handling-portal.corp.local
      - http://weather.corp.local
    duration: 5-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: web_browse
    repeat: 10-20
    delay_before: 5-10m
    targets_category: aviation_ops_reference
    duration: 5-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: web_browse
    repeat: 5-10
    delay_before: 15-30m
    targets_category: ecommerce
    duration: 5-10m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: email_send
    repeat: 8-15
    delay_before: 5-10m
    params:
      to: safety-office-puppet@corp.local
      template: generic
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: email_send
    delay_before: 5-10m
    params:
      to: safety-office-puppet@corp.local
      template: generic
      content_brief: >
        Write as the Ramp Control Supervisor, reporting a near-miss safety incident
        where a baggage tug came within a few feet of ground crew during pushback,
        and requesting the safety office log it for review at the next safety
        committee meeting. Factual, incident-report tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: ramp_safety_incident_log.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-15m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\fileserver01\\ramp-ops"
      ops: [browse, copy_file]
      file: ground_handling_procedures.pdf
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\fileserver01\\hr"
      ops: [browse, copy_file]
      file: staffing_roster_q3.xlsx
    duration: 1-2m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
