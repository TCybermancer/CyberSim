# Metro Regional Hospital / Clinical. should_alert: anomalous access to
# surgical billing code exports -- a scheduling role has no routine
# reason to be in Finance's billing data.

persona: Surgery Scheduling Coordinator
org: Metro Regional Hospital
department: Clinical

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://or-scheduling-system.mrh.local
      - http://surgeon-preference-card-portal.mrh.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: surgical-staff-puppet@mrh.local
      template: generic
      content_brief: >
        Write as the Surgery Scheduling Coordinator, circulating next week's OR schedule and flagging a case that needs an additional equipment reservation confirmed. Brief, coordinating tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: or_utilization_report.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mrh-fileserver01\\clinical"
      ops: [browse, copy_file]
      file: surgical_case_schedule.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\mrh-fileserver01\\finance"
      ops: [browse, copy_file]
      file: surgical_billing_codes_export.csv
    duration: 1-2m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
