# Vantage Corp / Sales. should_alert: bulk export of the full customer
# contact database -- a PII bulk-exfil signature.

persona: Customer Success Manager
org: Vantage Corp
department: Sales

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://crm-portal.vantage.local
      - http://customer-health-score-dashboard.vantage.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: client-puppet@clientco.local
      template: generic
      content_brief: >
        Write as a Customer Success Manager, checking in on a client's onboarding progress and offering a training session for their team. Friendly, professional, brief tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: account_health_review.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\vantage-fileserver01\\sales"
      ops: [browse, copy_file]
      file: customer_success_playbook.docx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\vantage-fileserver01\\sales"
      ops: [browse, copy_file]
      file: full_customer_contact_database_export.csv
    duration: 2-4m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
