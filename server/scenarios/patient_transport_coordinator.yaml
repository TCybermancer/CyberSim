# Metro Emergency Services / EMS. should_alert: anomalous access to a
# payroll PII export -- context misuse, distinct from the other EMS
# signatures. Email step also demonstrates cross-org realism, addressed
# to Metro Regional Hospital's domain.

persona: Patient Transport Coordinator
org: Metro Emergency Services
department: EMS

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://transport-scheduling-system.mes.local
      - http://hospital-bed-availability-board.mes.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: hospital-liaison-puppet@mrh.local
      template: generic
      content_brief: >
        Write as a Patient Transport Coordinator, coordinating a non-emergency inter-facility patient transport with the receiving hospital, confirming the pickup window and unit readiness. No sensitive medical details, routine tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: transport_schedule_log.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mes-fileserver01\\ems"
      ops: [browse, copy_file]
      file: transport_vehicle_maintenance_log.pdf
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\mes-fileserver01\\payroll"
      ops: [browse, copy_file]
      file: ems_staff_payroll_export.csv
    duration: 1-2m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
