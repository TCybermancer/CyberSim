# Vantage Corp / Finance. should_alert: a full-year payroll export --
# a PII bulk-exfil signature.

persona: Payroll Manager
org: Vantage Corp
department: Finance

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://payroll-system-portal.vantage.local
      - http://tax-compliance-portal.vantage.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: hr-benefits-puppet@vantage.local
      template: generic
      content_brief: >
        Write as the Payroll Manager, confirming the payroll processing schedule for the upcoming holiday and any deadline changes for timesheet submission. Brief, routine tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: payroll_processing_checklist.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\vantage-fileserver01\\finance"
      ops: [browse, copy_file]
      file: payroll_procedures_reference.docx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\vantage-fileserver01\\finance"
      ops: [browse, copy_file]
      file: employee_payroll_full_export_2026.csv
    duration: 2-4m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
