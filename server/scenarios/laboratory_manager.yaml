# Metro Regional Hospital / Diagnostics. should_alert: anomalous access
# to lab staff certification records -- a context-misuse signature.

persona: Laboratory Manager
org: Metro Regional Hospital
department: Diagnostics

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://lis-laboratory-system.mrh.local
      - http://reference-lab-portal.mrh.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: pathology-department-puppet@mrh.local
      template: generic
      content_brief: >
        Write as the Laboratory Manager, flagging a calibration issue on one analyzer that may require re-running a batch of overnight results, and requesting pathologist review. Technical, direct tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: lab_qc_compliance_report.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mrh-fileserver01\\laboratory"
      ops: [browse, copy_file]
      file: analyzer_maintenance_log.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\mrh-fileserver01\\hr"
      ops: [browse, copy_file]
      file: lab_staff_certification_records.pdf
    duration: 1-2m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
