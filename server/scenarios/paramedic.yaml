# Metro Emergency Services / EMS. should_alert: bulk access to the
# quarterly patient-care-report archive -- a paramedic normally only
# needs their own PCRs, not the bulk archive; PII-flavored signature.

persona: Paramedic
org: Metro Emergency Services
department: EMS

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://ems-charting-system.mes.local
      - http://hospital-diversion-status-board.mes.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: ems-shift-supervisor-puppet@mes.local
      template: generic
      content_brief: >
        Write as a Paramedic, reporting a supply shortage of a specific medication on their unit and requesting restocking before the next shift. Brief, routine tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: unit_supply_inventory_log.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mes-fileserver01\\ems"
      ops: [browse, copy_file]
      file: protocol_reference_guide.pdf
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\mes-fileserver01\\ems-records"
      ops: [browse, copy_file]
      file: patient_care_reports_q3.zip
    duration: 3-6m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
