# Metro Regional Hospital / Executive. should_alert: bulk access to
# employee medical-leave records -- a PII/medical-adjacent exfil
# signature.

persona: HR Director
org: Metro Regional Hospital
department: Executive

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://hris-portal.mrh.local
      - http://benefits-enrollment-system.mrh.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: all-staff-puppet@mrh.local
      template: generic
      content_brief: >
        Write as the HR Director, reminding staff that open enrollment for benefits closes at the end of the month, with a link to the enrollment portal. Friendly, brief, HR tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: staffing_and_turnover_report.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mrh-fileserver01\\hr"
      ops: [browse, copy_file]
      file: employee_relations_case_log.docx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\mrh-fileserver01\\hr"
      ops: [browse, copy_file]
      file: employee_medical_leave_records.pdf
    duration: 1-2m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
