# Meridian Logistics / Fleet. should_alert: anomalous access to fleet
# procurement invoices -- a maintenance role has no routine reason to
# be in Finance's invoice records.

persona: Fleet Maintenance Supervisor
org: Meridian Logistics
department: Fleet

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://fleet-maintenance-management-system.meridianlog.local
      - http://parts-inventory-portal.meridianlog.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: transportation-director-puppet@meridianlog.local
      template: generic
      content_brief: >
        Write as the Fleet Maintenance Supervisor, flagging that three vehicles are due for major service and requesting approval to take them offline for two days next week. Direct, professional tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: fleet_maintenance_schedule.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\meridian-fileserver01\\fleet"
      ops: [browse, copy_file]
      file: vehicle_service_history_log.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\meridian-fileserver01\\finance"
      ops: [browse, copy_file]
      file: fleet_procurement_invoices.xlsx
    duration: 1-2m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
