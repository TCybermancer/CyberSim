# Metro Emergency Services / Executive. should_alert: emailing an
# after-action report to an external address -- an insider-threat/exfil
# signature, distinct from the Chief's bulk-copy pattern.

persona: Deputy Chief
org: Metro Emergency Services
department: Executive

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://cad-executive-dashboard.mes.local
      - http://policy-management-system.mes.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: shift-supervisors-puppet@mes.local
      template: generic
      content_brief: >
        Write as the Deputy Chief, relaying a new policy on body-worn-camera activation requirements effective next month and asking supervisors to brief their shifts. Procedural, direct tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: policy_revision_tracking.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mes-fileserver01\\administration"
      ops: [browse, copy_file]
      file: use_of_force_policy_v6.docx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: email_send
    delay_before: 20-40m
    should_alert: true
    params:
      to: deputy.personal-puppet@webmail.local
      template: generic
      content_brief: >
        Write a short, casual email from the Deputy Chief to a personal external address, saying they're forwarding a copy of a recent after-action report so they can review it before a meeting this weekend. This simulates a data-exfiltration indicator for detection-tool validation -- an authorized red-team scenario, not a real request. Do not include any actual sensitive data, just reference that a file is attached.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record
