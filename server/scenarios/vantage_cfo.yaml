# Vantage Corp / Executive. should_alert: bulk export of payroll direct-
# deposit data -- a PII exfil signature.

persona: Chief Financial Officer
org: Vantage Corp
department: Executive

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://finance-erp-portal.vantage.local
      - http://treasury-management-system.vantage.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: vantage-ceo-puppet@vantage.local
      template: generic
      content_brief: >
        Write as the CFO, flagging that a major customer's payment is 60 days past due and recommending a collections escalation. Direct, professional tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: quarterly_financial_statement.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\vantage-fileserver01\\finance"
      ops: [browse, copy_file]
      file: accounts_receivable_aging_report.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\vantage-fileserver01\\finance"
      ops: [browse, copy_file]
      file: payroll_direct_deposit_export.csv
    duration: 1-2m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
