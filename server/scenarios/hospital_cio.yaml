# Metro Regional Hospital / Executive. should_alert: anomalous access to
# board compensation-committee notes -- context/appropriateness misuse
# rather than raw permission.

persona: Chief Information Officer
org: Metro Regional Hospital
department: Executive

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://it-governance-portal.mrh.local
      - http://vendor-management-system.mrh.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: it-department-heads-puppet@mrh.local
      template: generic
      content_brief: >
        Write as the Hospital CIO, outlining priorities for next quarter's EHR upgrade project and requesting department readiness assessments. Professional, strategic tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: it_capital_budget_plan.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mrh-fileserver01\\it"
      ops: [browse, copy_file]
      file: ehr_upgrade_project_plan.docx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\mrh-fileserver01\\executive"
      ops: [browse, copy_file]
      file: board_compensation_committee_notes.pdf
    duration: 1-2m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
