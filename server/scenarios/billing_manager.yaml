# Metro Regional Hospital / Administration. should_alert: bulk export of
# insurance claims data -- a PII/financial exfil signature.

persona: Billing Manager
org: Metro Regional Hospital
department: Administration

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://billing-system-portal.mrh.local
      - http://insurance-claims-clearinghouse.mrh.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: hospital-finance-director-puppet@mrh.local
      template: generic
      content_brief: >
        Write as the Billing Manager, reporting a spike in claim denials from a specific payer this month and recommending a coding review. Direct, professional tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: claims_denial_analysis.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mrh-fileserver01\\finance"
      ops: [browse, copy_file]
      file: billing_procedures_reference.pdf
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\mrh-fileserver01\\finance"
      ops: [browse, copy_file]
      file: insurance_claims_bulk_export_2026.csv
    duration: 2-4m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
