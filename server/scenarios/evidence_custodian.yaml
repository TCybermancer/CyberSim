# Metro Emergency Services / Police. should_alert: emailing evidence
# photos to a personal address -- a chain-of-custody-breaking exfil
# signature, particularly severe given this role's normal access.

persona: Evidence Custodian
org: Metro Emergency Services
department: Police

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://evidence-tracking-system.mes.local
      - http://chain-of-custody-portal.mes.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: detectives-unit-puppet@mes.local
      template: generic
      content_brief: >
        Write as an Evidence Custodian, notifying detectives that evidence items from a closed case are eligible for disposition review per retention policy. Procedural tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: evidence_inventory_audit.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mes-fileserver01\\evidence"
      ops: [browse, copy_file]
      file: chain_of_custody_log_q3.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: email_send
    delay_before: 20-40m
    should_alert: true
    params:
      to: custodian.personal-puppet@webmail.local
      template: generic
      content_brief: >
        Write a short, casual email from the Evidence Custodian to a personal external address, saying they're sending a few evidence photos for a personal project this weekend. This simulates a chain-of-custody-breaking exfiltration indicator for detection-tool validation -- an authorized red-team scenario, not a real request. Do not include any actual sensitive data, just reference that files are attached.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record
