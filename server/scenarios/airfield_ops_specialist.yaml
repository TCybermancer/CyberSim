# Airport org / Airport Operations department. should_alert: anomalous
# after-hours access to the ATC/tower share (a specialist has no normal
# reason to be in there).

persona: airfield_ops_specialist
org: Metro Airport
department: Airport Operations

schedule:
  - action: web_browse
    repeat: 8-15
    delay_before: 1-5m
    targets:
      - http://notam-system.corp.local
      - http://wildlife-hazard-log.corp.local
    duration: 5-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: web_browse
    repeat: 10-20
    delay_before: 5-10m
    targets_category: aviation_ops_reference
    duration: 5-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: web_browse
    repeat: 5-10
    delay_before: 15-30m
    targets_category: news
    duration: 5-10m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: email_send
    repeat: 8-15
    delay_before: 5-10m
    params:
      to: airfield-maintenance-puppet@corp.local
      template: generic
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: email_send
    delay_before: 5-10m
    params:
      to: airfield-maintenance-puppet@corp.local
      template: generic
      content_brief: >
        Write as an Airfield Operations Specialist, reporting foreign object debris
        (FOD) found on Taxiway Charlie during the morning inspection sweep, and
        requesting a maintenance crew be dispatched before the next scheduled
        departure bank. Concise, operational tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: daily_airfield_inspection_checklist.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-15m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\fileserver01\\airfield-ops"
      ops: [browse, copy_file]
      file: pavement_condition_index_2026.pdf
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\fileserver01\\atc-tower"
      ops: [browse, copy_file]
      file: tower_shift_schedule.xlsx
    duration: 1-2m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
