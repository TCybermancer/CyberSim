# Meridian Logistics / IT. should_alert: bulk download of network device
# config backups -- a real high-value target, since configs often
# embed credentials, consistent with the IT pattern established
# across orgs.

persona: WMS Administrator
org: Meridian Logistics
department: IT

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://wms-admin-console.meridianlog.local
      - http://barcode-label-management-portal.meridianlog.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: warehouse-manager-puppet@meridianlog.local
      template: generic
      content_brief: >
        Write as the WMS Administrator, notifying the warehouse of a WMS software update tonight that will briefly pause scanning operations, with the manual fallback procedure reminder. Technical, brief tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: wms_configuration_report.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\meridian-fileserver01\\it"
      ops: [browse, copy_file]
      file: wms_integration_reference.pdf
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\meridian-fileserver01\\it"
      ops: [browse, copy_file]
      file: device_config_backups_all_2026.zip
    duration: 3-6m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
