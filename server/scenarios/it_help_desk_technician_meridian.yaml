# Meridian Logistics / IT. should_alert: anomalous access to a domain-
# admin-credentials-adjacent share -- a privilege-escalation-attempt
# pattern, mirroring the airport counterpart intentionally.

persona: IT Help Desk Technician
org: Meridian Logistics
department: IT
after_hours_eligible: true

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://ticketing-system.meridianlog.local
      - http://remote-support-portal.meridianlog.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: warehouse-staff-puppet@meridianlog.local
      template: generic
      content_brief: >
        Write as an IT Help Desk Technician, replying to a user's password reset request with next steps (reset link sent via the self-service portal, call the help desk if it expires) -- do not include any actual password or reset code, just describe the process. Friendly, brief, support-desk tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: help_desk_ticket_backlog.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\meridian-fileserver01\\it"
      ops: [browse, copy_file]
      file: software_deployment_package_v4.zip
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\meridian-fileserver01\\it"
      ops: [browse, copy_file]
      file: domain_admin_credential_vault_export.csv
    duration: 1-2m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
