# Meridian Logistics / Executive. should_alert: anomalous access to
# vendor invoice data -- a warehouse manager has no routine reason
# to be in Finance's invoice records.

persona: Warehouse Manager
org: Meridian Logistics
department: Executive

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://wms-portal.meridianlog.local
      - http://labor-management-system.meridianlog.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: warehouse-supervisors-puppet@meridianlog.local
      template: generic
      content_brief: >
        Write as the Warehouse Manager, notifying supervisors of a staffing schedule change for the upcoming peak shipping period and requesting confirmation of coverage. Brief, coordinating tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: warehouse_labor_schedule.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\meridian-fileserver01\\warehouse"
      ops: [browse, copy_file]
      file: warehouse_layout_and_slotting_plan.pdf
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\meridian-fileserver01\\finance"
      ops: [browse, copy_file]
      file: vendor_invoices_q3.xlsx
    duration: 1-2m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
