# Airport org / Security department. should_alert: bulk copy of the
# CCTV footage archive (surveillance-footage exfiltration -- a
# genuinely sensitive category on its own).

persona: cctv_monitoring_operator
org: Metro Airport
department: Security

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://vms-dashboard.corp.local
      - http://camera-health-monitor.corp.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: it-help-desk-puppet@corp.local
      template: generic
      content_brief: >
        Write as a CCTV Monitoring Operator, reporting that camera 14 covering the
        Concourse B security lane has been offline since this morning, and
        requesting an IT ticket be opened to get it back online before the evening
        shift. Brief, operational tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: camera_coverage_incident_log.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-15m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\fileserver01\\cctv"
      ops: [browse]
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\fileserver01\\cctv"
      ops: [browse, copy_file]
      file: checkpoint_footage_archive_q3.zip
    duration: 5-10m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
