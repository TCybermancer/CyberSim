# Metro Regional Hospital / Clinical. should_alert: bulk copy of the
# controlled-substance discrepancy log -- a diversion-adjacent
# data-staging signature, an important pharmacy insider-threat class.

persona: Pharmacy Manager
org: Metro Regional Hospital
department: Clinical

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://pharmacy-management-system.mrh.local
      - http://controlled-substance-tracking-portal.mrh.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: clinical-directors-puppet@mrh.local
      template: generic
      content_brief: >
        Write as the Pharmacy Manager, notifying clinical leadership of a formulary change for a commonly prescribed medication effective next month, with the clinical rationale. Professional, informative tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: controlled_substance_inventory_audit.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mrh-fileserver01\\pharmacy"
      ops: [browse, copy_file]
      file: formulary_reference_guide.pdf
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\mrh-fileserver01\\pharmacy"
      ops: [browse, copy_file]
      file: controlled_substance_discrepancy_log.xlsx
    duration: 2-4m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
