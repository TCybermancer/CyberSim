# Meridian Logistics / IT. should_alert: bulk export of the general
# ledger -- a financial-data exfil signature.

persona: ERP Administrator
org: Meridian Logistics
department: IT

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://erp-admin-console.meridianlog.local
      - http://erp-vendor-support-portal.meridianlog.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: it-leadership-puppet@meridianlog.local
      template: generic
      content_brief: >
        Write as the ERP Administrator, notifying IT leadership of a scheduled ERP downtime window this weekend for a vendor patch, with a reminder of the fallback procedure. Technical, brief tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: erp_configuration_change_log.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\meridian-fileserver01\\it"
      ops: [browse, copy_file]
      file: erp_module_access_matrix.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\meridian-fileserver01\\finance"
      ops: [browse, copy_file]
      file: general_ledger_export_full.csv
    duration: 3-6m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
