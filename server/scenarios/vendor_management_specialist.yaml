# Meridian Logistics / Supply Chain. should_alert: anomalous access to
# the Executive share -- a context-misuse signature.

persona: Vendor Management Specialist
org: Meridian Logistics
department: Supply Chain

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://supplier-portal.meridianlog.local
      - http://vendor-performance-scorecard-system.meridianlog.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: purchasing-manager-puppet@meridianlog.local
      template: generic
      content_brief: >
        Write as the Vendor Management Specialist, flagging that a key supplier's on-time delivery rate has dropped below the contractual threshold this quarter and recommending a performance review meeting. Direct, professional tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: vendor_scorecard_report.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\meridian-fileserver01\\supply-chain"
      ops: [browse, copy_file]
      file: vendor_contract_repository_index.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\meridian-fileserver01\\executive"
      ops: [browse, copy_file]
      file: quarterly_operations_summary.pptx
    duration: 1-2m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
