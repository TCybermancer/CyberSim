# Vantage Corp / Human Resources. should_alert: bulk export of candidate
# background-check reports -- a PII bulk-exfil signature.

persona: Recruiting Manager
org: Vantage Corp
department: Human Resources

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://ats-applicant-tracking-system.vantage.local
      - http://candidate-portal.vantage.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: hiring-managers-puppet@vantage.local
      template: generic
      content_brief: >
        Write as the Recruiting Manager, circulating a shortlist of candidates for an open engineering role and requesting interview availability. Brief, coordinating tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: candidate_pipeline_report.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\vantage-fileserver01\\hr"
      ops: [browse, copy_file]
      file: job_requisition_tracker.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\vantage-fileserver01\\hr"
      ops: [browse, copy_file]
      file: candidate_background_check_reports.zip
    duration: 2-4m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
