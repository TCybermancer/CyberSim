# Vantage Corp / Sales. should_alert: anomalous access to customer
# payment history -- a sales role has no routine reason to be in
# Finance's payment data.

persona: Sales Account Executive
org: Vantage Corp
department: Sales

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://crm-portal.vantage.local
      - http://sales-enablement-portal.vantage.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: prospect-puppet@clientco.local
      template: generic
      content_brief: >
        Write as a Sales Account Executive, following up after a product demo with a proposed pricing structure and next steps -- no real pricing figures needed. Professional, sales tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: sales_pipeline_forecast.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\vantage-fileserver01\\sales"
      ops: [browse, copy_file]
      file: account_territory_map.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\vantage-fileserver01\\finance"
      ops: [browse, copy_file]
      file: customer_payment_history_export.csv
    duration: 1-2m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
