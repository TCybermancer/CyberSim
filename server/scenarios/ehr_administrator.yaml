# Metro Regional Hospital / IT. should_alert: a bulk patient-records
# query export -- a privilege-abuse signature, mirroring the airport
# Identity & Access Administrator's context-misuse pattern.

persona: EHR Administrator
org: Metro Regional Hospital
department: IT

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://ehr-portal.mrh.local
      - http://ehr-vendor-support-portal.mrh.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: clinical-informatics-puppet@mrh.local
      template: generic
      content_brief: >
        Write as the EHR Administrator, notifying clinical informatics of a scheduled EHR downtime window this weekend for a vendor patch, with a reminder of the fallback documentation procedure. Technical, brief tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: ehr_configuration_change_log.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mrh-fileserver01\\it"
      ops: [browse, copy_file]
      file: ehr_access_role_matrix.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\mrh-fileserver01\\clinical"
      ops: [browse, copy_file]
      file: patient_records_bulk_query_export.csv
    duration: 3-6m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
