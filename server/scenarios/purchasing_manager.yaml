# Meridian Logistics / Supply Chain. should_alert: bulk export of vendor
# payment records -- a PII/financial exfil signature.

persona: Purchasing Manager
org: Meridian Logistics
department: Supply Chain

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://erp-procurement-portal.meridianlog.local
      - http://supplier-portal.meridianlog.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: vendor-puppet@supplier.local
      template: generic
      content_brief: >
        Write as the Purchasing Manager, requesting an updated quote from a supplier ahead of next quarter's bulk packaging materials order. Brief, business tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: purchase_order_tracking.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\meridian-fileserver01\\supply-chain"
      ops: [browse, copy_file]
      file: supplier_contract_summary.docx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\meridian-fileserver01\\finance"
      ops: [browse, copy_file]
      file: vendor_payment_records_export.csv
    duration: 2-4m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
