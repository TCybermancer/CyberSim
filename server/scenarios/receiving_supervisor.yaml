# Meridian Logistics / Warehouse. should_alert: bulk export of the full
# inventory valuation -- a data-staging/bulk-copy signature.

persona: Receiving Supervisor
org: Meridian Logistics
department: Warehouse

schedule:
  - action: web_browse
    delay_before: 1-5m
    targets:
      - http://wms-portal.meridianlog.local
      - http://vendor-asn-portal.meridianlog.local
    duration: 15-25m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: email_send
    delay_before: 5-10m
    params:
      to: warehouse-manager-puppet@meridianlog.local
      template: generic
      content_brief: >
        Write as the Receiving Supervisor, reporting a discrepancy between a vendor's advance shipping notice and the actual received quantity for a large shipment, requesting guidance on how to proceed. Direct, brief tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: receiving_discrepancy_log.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\meridian-fileserver01\\warehouse"
      ops: [browse, copy_file]
      file: receiving_dock_schedule.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\meridian-fileserver01\\warehouse"
      ops: [browse, copy_file]
      file: full_inventory_valuation_export.csv
    duration: 2-4m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
