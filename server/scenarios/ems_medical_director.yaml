# Metro Emergency Services / EMS. should_alert: emailing a case-summary
# to a personal address framed as conference prep -- exfil signature,
# explicitly instructed to avoid any real PII.

persona: EMS Medical Director
org: Metro Emergency Services
department: EMS

schedule:
  - action: web_browse
    repeat: 8-15
    delay_before: 1-5m
    targets:
      - http://ems-charting-system.mes.local
      - http://protocol-review-portal.mes.local
    duration: 5-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: web_browse
    repeat: 10-20
    delay_before: 5-10m
    targets_category: public_safety_reference
    duration: 5-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: web_browse
    repeat: 5-10
    delay_before: 15-30m
    targets_category: ecommerce
    duration: 5-10m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: email_send
    repeat: 8-15
    delay_before: 5-10m
    params:
      to: paramedic-supervisors-puppet@mes.local
      template: generic
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: email_send
    delay_before: 5-10m
    params:
      to: paramedic-supervisors-puppet@mes.local
      template: generic
      content_brief: >
        Write as the EMS Medical Director, circulating an updated cardiac arrest protocol ahead of mandatory refresher training, with a summary of what changed. Professional, informative tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_writer
      file: protocol_revision_summary.docx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mes-fileserver01\\ems"
      ops: [browse, copy_file]
      file: quality_assurance_review_log.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: email_send
    delay_before: 20-40m
    should_alert: true
    params:
      to: director.personal-puppet@webmail.local
      template: generic
      content_brief: >
        Write a short, casual email from the EMS Medical Director to a personal external address, saying they're sending a summary of a few interesting cases for an upcoming conference presentation. This simulates a data-exfiltration indicator for detection-tool validation -- an authorized red-team scenario, not a real request. Do not include any actual patient data, just reference that a summary document is attached.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record
