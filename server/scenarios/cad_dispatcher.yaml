# Metro Emergency Services / Dispatch. should_alert: anomalous access to
# active police investigation files -- a dispatcher has no normal reason
# to be there.

persona: CAD Dispatcher
org: Metro Emergency Services
department: Dispatch

schedule:
  - action: web_browse
    repeat: 8-15
    delay_before: 1-5m
    targets:
      - http://cad-dispatch-console.mes.local
      - http://unit-status-board.mes.local
    duration: 5-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: web_browse
    repeat: 10-20
    delay_before: 5-10m
    targets_category: public_safety_reference
    duration: 5-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: web_browse
    repeat: 5-10
    delay_before: 15-30m
    targets_category: social_media
    duration: 5-10m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: email_send
    repeat: 8-15
    delay_before: 5-10m
    params:
      to: patrol-supervisors-puppet@mes.local
      template: generic
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: email_send
    delay_before: 5-10m
    params:
      to: patrol-supervisors-puppet@mes.local
      template: generic
      content_brief: >
        Write as a CAD Dispatcher, flagging a pattern of delayed unit response times in the north sector over the past week for review. Informational, no-alarm tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: unit_response_time_report.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-20m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\mes-fileserver01\\dispatch"
      ops: [browse, copy_file]
      file: cad_workflow_reference.pdf
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: smb_access
    delay_before: 20-40m
    should_alert: true
    params:
      share: "\\\\mes-fileserver01\\police"
      ops: [browse, copy_file]
      file: active_investigation_case_files.zip
    duration: 2-4m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log
