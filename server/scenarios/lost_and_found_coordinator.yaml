# Airport org / Airport Operations department. should_alert: browsing a
# spoofed "lost item claim" verification domain -- lost & found deals in
# passenger-identifying details, so a claim-verification phishing pretext
# fits this role specifically.

persona: lost_and_found_coordinator
org: Metro Airport
department: Airport Operations

schedule:
  - action: web_browse
    repeat: 8-15
    delay_before: 1-5m
    targets:
      - http://lost-and-found-tracker.corp.local
      - http://courier-shipping-portal.corp.local
    duration: 5-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session

  - action: web_browse
    repeat: 10-20
    delay_before: 5-10m
    targets_category: aviation_ops_reference
    duration: 5-15m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: web_browse
    repeat: 5-10
    delay_before: 15-30m
    targets_category: ecommerce
    duration: 5-10m
    expected_artifacts:
      - browser_history_entry
      - dns_query

  - action: email_send
    repeat: 8-15
    delay_before: 5-10m
    params:
      to: baggage-services-puppet@corp.local
      template: generic
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: email_send
    delay_before: 5-10m
    params:
      to: baggage-services-puppet@corp.local
      template: generic
      content_brief: >
        Write as the Lost & Found Coordinator, following up with Airline Baggage
        Services about a mishandled-bag claim that matches an item logged in lost
        and found yesterday, asking them to confirm the passenger's claim reference
        number so the item can be released for courier delivery. Helpful,
        procedural tone.
    expected_artifacts:
      - smtp_send_log
      - mail_server_delivery_record

  - action: office_doc
    delay_before: 10-15m
    params:
      app: libreoffice_calc
      file: lost_item_inventory_log.xlsx
      ops: [open, edit_cells, save, close]
    duration: 10-15m
    expected_artifacts:
      - process_start_soffice
      - file_write_event
      - file_hash_delta

  - action: smb_access
    delay_before: 5-10m
    params:
      share: "\\\\fileserver01\\lost-and-found"
      ops: [browse, copy_file]
      file: unclaimed_items_90day.xlsx
    duration: 1-3m
    expected_artifacts:
      - smb_session_log
      - file_server_access_log

  - action: web_browse
    delay_before: 20-40m
    should_alert: true
    targets:
      - http://lost-item-claim-verify.example
    duration: 2-5m
    expected_artifacts:
      - browser_history_entry
      - dns_query
      - tls_session
