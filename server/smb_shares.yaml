# Per-org SMB share pools for smb_access steps (see
# scenario_engine.py's _resolve_share()). A step can use
# `shares_category: <department>` instead of hand-writing a `share:`
# path -- resolves against this scenario's own `org:` field, so a
# Finance persona at "Vantage Corp" and one at "Metro Regional Hospital"
# land on their own org's finance share, never each other's.
# `shares_category: random` picks any department's share within the
# same org via the same seeded rng.choice() used elsewhere, for a step
# that plausibly reaches outside its own department (or as a directorate-
# to-directorate file-movement narrative -- see DEVELOPER_NOTES.md
# "Ranges"/"targets_category").
#
# These are the exact per-department share paths already hand-written
# across server/scenarios/*.yaml, pulled together into one shared pool
# rather than duplicated -- not new/invented infrastructure. Each org
# has exactly one file server today (fileserver01 / vantage-fileserver01
# / mes-fileserver01 / mrh-fileserver01 / meridian-fileserver01); a
# scenario file's own hand-written `share:` for its own department
# still works unchanged and takes precedence if both are given (a hard
# error, not a silent pick -- see _resolve_share()).

