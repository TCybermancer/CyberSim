# Publishes on all interfaces by default -- see docs/README.md "OOB
# network separation" for why this needs a firewall rule (or an
# explicit host IP below, e.g. "10.99.0.5:8000:8000") restricting it to
# the OOB network in a real deployment, not just port 8000 open to
# whatever the host can reach.
services:
  cybersim-server:
    build: .
    image: cybersim-server:latest
    ports:
      - "8000:8000"
    volumes:
      - cybersim-data:/data
      # Uncomment to edit scenarios without rebuilding the image:
      # - ./scenarios:/app/scenarios
    restart: unless-stopped

volumes:
  cybersim-data:
